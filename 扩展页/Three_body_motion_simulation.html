  }
  
  .star {
    position: absolute;
    background-color: white;
    border-radius: 50%;

<script>
  // 生成星空背景
  function createStarfield() {
    const starfield = document.getElementById('starfield');
    const starsCount = 300;
    
    for (let i = 0; i < starsCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      
      // 随机位置和大小
      const size = Math.random() * 2;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.animationDelay = `${Math.random() * 3}s`;
      
      starfield.appendChild(star);
    }
  }
  
  // 初始化时调用
  createStarfield();
</script>

<script>
  // 菜单切换功能
  document.querySelectorAll('.menu-tab').forEach(tab => {

  });
  
  // 检测三体现象（简化版）
  function checkPhenomena() {
    const phenomenonEl = document.getElementById('phenomenonText');
    
    // 检测三日凌空（三个天体接近）
    const distances = [];
    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        const dx = bodies[i].x - bodies[j].x;
        const dy = bodies[i].y - bodies[j].y;
        const dz = bodies[i].z - bodies[j].z;
        distances.push(Math.sqrt(dx*dx + dy*dy + dz*dz));
      }
    }
    
    if (distances.every(d => d < 300)) {
      phenomenonEl.textContent = "观测现象: 三日凌空";
      phenomenonEl.style.color = "#ffd166";
    } else {
      phenomenonEl.textContent = "正常运行中";
      phenomenonEl.style.color = "inherit";
    }
  }
  
  // 鼠标悬停检测
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    
    bodies.forEach(body => {
      // 简单碰撞检测
      const dx = mouseX - (body.x + canvas.width/2);
      const dy = mouseY - (body.y + canvas.height/2);
      const distance = Math.sqrt(dx*dx + dy*dy);
      body.isHovered = distance < body.radius * 2;
    });
  });
</script>
    
    <!-- 信息面板 -->
    <div class="absolute bottom-4 left-4 glass-effect bg-dark/60 rounded-xl p-4 border border-white/10 shadow-lg z-10">
      <div class="text-sm">
        <p>三体问题是指三个质量、初始位置和初始速度都是任意的可视为质点的天体，在相互之间万有引力的作用下的运动规律问题。</p>
        <p class="mt-2 text-gray-400">由于其运动方程无法用解析方法求解，这里使用数值方法进行近似模拟。</p>

  <script>
    // 三体运动模拟核心代码
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('simulationCanvas');
      const ctx = canvas.getContext('2d');
      
      // 设置画布尺寸
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      
      // 物理常量
      const G = 100; // 引力常量（放大以便观察）
      let timeStep = 0.01; // 时间步长
      
      // 三体对象
      let bodies = [
        {
          mass: 1000,
          x: canvas.width * 0.3,
          y: canvas.height / 2,
          vx: 0,
          vy: 5,
          radius: 15,
          color: '#8B5CF6', // 紫色
          trail: []
        },
        {
          mass: 1000,
          x: canvas.width * 0.5,
          y: canvas.height / 2,
          vx: 0,
          vy: -5,
          radius: 15,
          color: '#3B82F6', // 蓝色
          trail: []
        },
        {
          mass: 1000,
          x: canvas.width * 0.7,
          y: canvas.height / 2,
          vx: 0,
          vy: 0,
          radius: 15,
          color: '#EC4899', // 粉色
          trail: []
        }
      ];
      
      // 模拟状态
      let isRunning = true;
      let trailLength = 100;
      let showTrail = true;
      
      // 计算引力
      function calculateGravity(bodyA, bodyB) {
        const dx = bodyB.x - bodyA.x;
        const dy = bodyB.y - bodyA.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        // 避免除以零
        if (distance < bodyA.radius + bodyB.radius) {
          return { fx: 0, fy: 0 };
        }
        
        // 万有引力公式 F = G * m1 * m2 / r²
        const force = (G * bodyA.mass * bodyB.mass) / (distance * distance);
        const angle = Math.atan2(dy, dx);
        
        return {
          fx: force * Math.cos(angle),
          fy: force * Math.sin(angle)
        };
      }
      
      // 更新位置和速度
      function updateBodies() {
        if (!isRunning) return;
        
        // 计算每个天体受到的力
        const forces = bodies.map(() => ({ fx: 0, fy: 0 }));
        
        for (let i = 0; i < bodies.length; i++) {
          for (let j = i + 1; j < bodies.length; j++) {
            const gravity = calculateGravity(bodies[i], bodies[j]);
            
            // 力是相互的
            forces[i].fx += gravity.fx;
            forces[i].fy += gravity.fy;
            forces[j].fx -= gravity.fx;
            forces[j].fy -= gravity.fy;
          }
        }
        
        // 更新速度和位置
        bodies.forEach((body, index) => {
          // F = ma => a = F/m
          const ax = forces[index].fx / body.mass;
          const ay = forces[index].fy / body.mass;
          
          // 更新速度
          body.vx += ax * timeStep;
          body.vy += ay * timeStep;
          
          // 更新位置
          body.x += body.vx * timeStep;
          body.y += body.vy * timeStep;
          
          // 边界处理 - 反弹
          if (body.x < body.radius || body.x > canvas.width - body.radius) {
            body.vx = -body.vx * 0.95; // 能量损失
            body.x = Math.max(body.radius, Math.min(canvas.width - body.radius, body.x));
          }
          
          if (body.y < body.radius || body.y > canvas.height - body.radius) {
            body.vy = -body.vy * 0.95; // 能量损失
            body.y = Math.max(body.radius, Math.min(canvas.height - body.radius, body.y));
          }
          
          // 记录轨迹
          body.trail.push({ x: body.x, y: body.y });
          if (body.trail.length > trailLength) {
            body.trail.shift();
          }
        });
      }
      
      // 绘制场景
      function draw() {
        // 清空画布
        ctx.fillStyle = 'rgba(15, 23, 42, 0.1)'; // 半透明背景，产生轨迹渐变消失效果
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 绘制轨迹
        if (showTrail) {
          bodies.forEach(body => {
            if (body.trail.length < 2) return;
            
            ctx.beginPath();
            ctx.moveTo(body.trail[0].x, body.trail[0].y);
            
            for (let i = 1; i < body.trail.length; i++) {
              ctx.lineTo(body.trail[i].x, body.trail[i].y);
            }
            
            ctx.strokeStyle = `${body.color}40`; // 带透明度
            ctx.lineWidth = 2;
            ctx.stroke();
          });
        }
        
        // 绘制天体
        bodies.forEach(body => {
          ctx.beginPath();
          ctx.arc(body.x, body.y, body.radius, 0, Math.PI * 2);
          ctx.fillStyle = body.color;
          ctx.fill();
          
          // 绘制光晕
          ctx.beginPath();
          ctx.arc(body.x, body.y, body.radius * 1.5, 0, Math.PI * 2);
          ctx.fillStyle = `${body.color}30`;
          ctx.fill();
        });
      }
      
      // 动画循环
      function animate() {
        updateBodies();
        draw();
        requestAnimationFrame(animate);
      }
      
      // 开始动画
      animate();
      
      // 控制面板事件
      document.getElementById('startBtn').addEventListener('click', () => {
        isRunning = true;
      });
      
      document.getElementById('pauseBtn').addEventListener('click', () => {
        isRunning = false;
      });
      
      document.getElementById('resetBtn').addEventListener('click', () => {
        // 重置三体位置和速度
        bodies = [
          {
            mass: parseFloat(document.getElementById('mass1Slider').value),
            x: canvas.width * 0.3,
            y: canvas.height / 2,
            vx: 0,
            vy: 5,
            radius: 15,
            color: '#8B5CF6',
            trail: []
          },
          {
            mass: parseFloat(document.getElementById('mass2Slider').value),
            x: canvas.width * 0.5,
            y: canvas.height / 2,
            vx: 0,
            vy: -5,
            radius: 15,
            color: '#3B82F6',
            trail: []
          },
          {
            mass: parseFloat(document.getElementById('mass3Slider').value),
            x: canvas.width * 0.7,
            y: canvas.height / 2,
            vx: 0,
            vy: 0,
            radius: 15,
            color: '#EC4899',
            trail: []
          }
        ];
      });
      
      // 速度控制
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      
      speedSlider.addEventListener('input', () => {
        timeStep = parseFloat(speedSlider.value) * 0.01;
        speedValue.textContent = `${speedSlider.value}x`;
      });
      
      // 质量控制
      const massSliders = [
        document.getElementById('mass1Slider'),
        document.getElementById('mass2Slider'),
        document.getElementById('mass3Slider')
      ];
      
      const massValues = [
        document.getElementById('mass1Value'),
        document.getElementById('mass2Value'),
        document.getElementById('mass3Value')
      ];
      
      massSliders.forEach((slider, index) => {
        slider.addEventListener('input', () => {
          bodies[index].mass = parseFloat(slider.value);
          massValues[index].textContent = slider.value;
        });
      });
      
      // 轨迹控制
      document.getElementById('showTrail').addEventListener('change', (e) => {
        showTrail = e.target.checked;
      });
      
      // 轨迹长度控制
      document.getElementById('trailLength').addEventListener('input', (e) => {
        trailLength = parseInt(e.target.value);
        
        // 截断现有轨迹
        bodies.forEach(body => {
          while (body.trail.length > trailLength) {
            body.trail.shift();
          }
        });
      });
    });

    // 修改三体模拟核心逻辑为3D
let bodies = [
  {
    mass: 1000,
    x: canvas.width * 0.3,
    y: canvas.height / 2,
    z: 0, // 新增z坐标
    vx: 0,
    vy: 5,
    vz: 1, // 新增z方向速度
    radius: 15,
    color: '#8B5CF6',
    trail: []
  },
  // 其他天体类似添加z属性...
];

// 修改力的计算为3D
function calculateGravitationalForce(body1, body2) {
  const dx = body2.x - body1.x;
  const dy = body2.y - body1.y;
  const dz = body2.z - body1.z; // 新增z方向计算
  const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
  
  // 避免除以零
  if (distance < body1.radius + body2.radius) {
    handleCollision(body1, body2);
    return { fx: 0, fy: 0, fz: 0 };
  }
  
  // 万有引力公式
  const force = (G * body1.mass * body2.mass) / (distance * distance);
  
  // 力的分量
  const fx = (force * dx) / distance;
  const fy = (force * dy) / distance;
  const fz = (force * dz) / distance; // 新增z方向力
  
  return { fx, fy, fz };
}

// 更新绘制函数支持3D透视
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // 绘制3D坐标系
  if (showCoordinates) {
    draw3DCoordinates();
  }
  
  // 绘制轨迹（考虑z轴透视）
  if (showTrail) {
    bodies.forEach(body => {
      if (body.trail.length > 1) {
        ctx.beginPath();
        body.trail.forEach((point, index) => {
          // 应用透视效果
          const zFactor = 1 / (1 + point.z * 0.001);
          const x = point.x * zFactor + canvas.width / 2;
          const y = point.y * zFactor + canvas.height / 2;
          
          if (index === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        });
        ctx.strokeStyle = `${body.color}40`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    });
  }
  
  // 绘制天体（考虑z轴透视）
  bodies.forEach(body => {
    // 应用透视效果
    const zFactor = 1 / (1 + body.z * 0.001);
    const x = body.x * zFactor + canvas.width / 2;
    const y = body.y * zFactor + canvas.height / 2;
    const radius = body.radius * zFactor;
    
    // 绘制光晕
    ctx.beginPath();
    ctx.arc(x, y, radius * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = `${body.color}30`;
    ctx.fill();
    
    // 绘制天体
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = body.color;
    ctx.fill();
    
    // 如果鼠标悬停，添加高亮效果
    if (body.isHovered) {
      ctx.beginPath();
      ctx.arc(x, y, radius * 1.2, 0, Math.PI * 2);
      ctx.strokeStyle = body.color;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  });
  
  // 显示天体坐标
  if (showCoordinates) {
    bodies.forEach((body, index) => {
      ctx.fillStyle = body.color;
      ctx.font = '12px monospace';
      ctx.fillText(
        `天体 ${index+1}: (${Math.round(body.x)}, ${Math.round(body.y)}, ${Math.round(body.z)})`,
        10, 30 + (index * 20)
      );
    });
  }
}
