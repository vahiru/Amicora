<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户设备检测与网络诊断</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            padding: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card-header {
            background: linear-gradient(to right, #4b6cb7, #182848);
            color: white;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            font-size: 1.3rem;
        }
        
        .card-header i {
            margin-right: 12px;
            font-size: 1.5rem;
        }
        
        .card-body {
            padding: 25px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #4b6cb7;
        }
        
        .info-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }
        
        .info-label i {
            margin-right: 8px;
            color: #4b6cb7;
        }
        
        .info-value {
            font-size: 1.2rem;
            color: #222;
            font-weight: 500;
            word-break: break-all;
        }
        
        .loading {
            color: #6c757d;
            font-style: italic;
        }
        
        .success {
            color: #28a745;
        }
        
        .warning {
            color: #ffc107;
        }
        
        .error {
            color: #dc3545;
        }
        
        .diagnostic-id {
            font-family: monospace;
            background: #f1f1f1;
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px dashed #ccc;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        #refreshBtn {
            background: linear-gradient(to right, #4b6cb7, #182848);
            color: white;
        }
        
        #copyBtn {
            background: linear-gradient(to right, #28a745, #20c997);
            color: white;
        }
        
        button:hover {
            opacity: 0.9;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        button i {
            margin-right: 10px;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: white;
            opacity: 0.8;
            font-size: 0.9rem;
        }
        
        .latency-test {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }
        
        .latency-value {
            margin-left: 10px;
            font-weight: 600;
        }
        
        .latency-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
            margin-right: 8px;
        }
        
        .latency-good {
            background-color: #28a745;
        }
        
        .latency-medium {
            background-color: #ffc107;
        }
        
        .latency-poor {
            background-color: #dc3545;
        }
        
        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .buttons {
                flex-direction: column;
                gap: 15px;
            }
            
            button {
                width: 100%;
            }
        }
        
        .error-code {
            font-family: monospace;
            padding: 3px 8px;
            background-color: #f8d7da;
            border-radius: 4px;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .no-error {
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-laptop-medical"></i> 设备检测与网络诊断</h1>
            <p class="subtitle">检测您的设备信息并测试网络连接状态</p>
        </header>
        
        <div class="card">
            <div class="card-header">
                <i class="fas fa-desktop"></i> 设备与浏览器信息
            </div>
            <div class="card-body">
                <div class="info-grid" id="deviceInfo">
                    <!-- 设备信息将在这里动态生成 -->
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <i class="fas fa-network-wired"></i> 网络诊断信息
            </div>
            <div class="card-body">
                <div class="info-grid" id="networkInfo">
                    <!-- 网络信息将在这里动态生成 -->
                </div>
            </div>
        </div>
        
        <div class="buttons">
            <button id="refreshBtn">
                <i class="fas fa-redo-alt"></i> 重新检测
            </button>
            <button id="copyBtn">
                <i class="far fa-clipboard"></i> 复制诊断报告
            </button>
        </div>
        
        <div class="footer">
            <p>本工具仅用于设备信息检测和网络诊断，不会收集任何个人隐私数据</p>
            <p>诊断结果仅显示在您的浏览器中，不会上传到任何服务器</p>
        </div>
    </div>

    <script>
        // 生成唯一的诊断ID
        function generateDiagnosticId() {
            const timestamp = Date.now().toString(36);
            const randomStr = Math.random().toString(36).substring(2, 8);
            return `DIAG-${timestamp}-${randomStr}`.toUpperCase();
        }

        // 获取浏览器内核和版本
        function getBrowserInfo() {
            const ua = navigator.userAgent;
            let kernel = "未知";
            let version = "未知";
            
            // 检测内核
            if (ua.includes("Trident") || ua.includes("MSIE")) {
                kernel = "Trident (IE)";
            } else if (ua.includes("Edge")) {
                kernel = "EdgeHTML (旧版Edge)";
            } else if (ua.includes("Edg")) {
                kernel = "Chromium (新版Edge)";
            } else if (ua.includes("Chrome")) {
                kernel = "Chromium/Blink (Chrome)";
            } else if (ua.includes("Safari") && !ua.includes("Chrome")) {
                kernel = "WebKit (Safari)";
            } else if (ua.includes("Firefox")) {
                kernel = "Gecko (Firefox)";
            } else if (ua.includes("Opera") || ua.includes("OPR")) {
                kernel = "Presto/Blink (Opera)";
            }
            
            // 提取版本号
            const versionMatch = ua.match(/(chrome|safari|firefox|msie|trident|edge|edg|opera|opr)\/?\s*(\d+)/i);
            if (versionMatch && versionMatch[2]) {
                version = versionMatch[2];
            }
            
            return { kernel, version };
        }

        // 获取操作系统信息
        function getOSInfo() {
            const ua = navigator.userAgent;
            let os = "未知";
            
            if (ua.includes("Windows NT 10.0")) os = "Windows 10/11";
            else if (ua.includes("Windows NT 6.3")) os = "Windows 8.1";
            else if (ua.includes("Windows NT 6.2")) os = "Windows 8";
            else if (ua.includes("Windows NT 6.1")) os = "Windows 7";
            else if (ua.includes("Windows NT 6.0")) os = "Windows Vista";
            else if (ua.includes("Windows NT 5.1")) os = "Windows XP";
            else if (ua.includes("Windows NT 5.0")) os = "Windows 2000";
            else if (ua.includes("Mac")) os = "macOS/iOS";
            else if (ua.includes("Linux")) os = "Linux";
            else if (ua.includes("Android")) os = "Android";
            else if (ua.includes("iOS") || ua.includes("iPhone") || ua.includes("iPad")) os = "iOS";
            
            return os;
        }

        // 测试访问延迟
        function testLatency(url, callback) {
            const startTime = Date.now();
            const img = new Image();
            
            // 设置超时时间（10秒）
            const timeout = setTimeout(() => {
                callback(null, "超时");
            }, 10000);
            
            img.onload = function() {
                clearTimeout(timeout);
                const latency = Date.now() - startTime;
                callback(latency, null);
            };
            
            img.onerror = function() {
                clearTimeout(timeout);
                callback(null, "失败");
            };
            
            // 添加时间戳防止缓存
            img.src = url + "?t=" + Date.now();
        }

        // 获取页面加载延迟
        function getPageLoadTime() {
            if (window.performance && window.performance.timing) {
                const perf = window.performance.timing;
                return perf.loadEventEnd - perf.navigationStart;
            }
            return null;
        }

        // 获取故障代码（模拟）
        function getErrorCode() {
            // 模拟随机错误代码（大多数情况下无错误）
            const errorCodes = ["NONE", "ERR_CONNECTION_TIMEOUT", "ERR_CERT_AUTHORITY_INVALID", "ERR_NAME_NOT_RESOLVED"];
            const random = Math.random();
            
            if (random > 0.8) {
                return errorCodes[Math.floor(Math.random() * (errorCodes.length - 1)) + 1];
            }
            return "NONE";
        }

        // 格式化时间
        function formatTime(date) {
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // 获取延迟等级
        function getLatencyLevel(latency) {
            if (latency < 200) return { class: "latency-good", text: "优秀" };
            if (latency < 500) return { class: "latency-medium", text: "一般" };
            return { class: "latency-poor", text: "较差" };
        }

        // 更新设备信息显示
        function updateDeviceInfo() {
            const browserInfo = getBrowserInfo();
            const osInfo = getOSInfo();
            const pageLoadTime = getPageLoadTime();
            const errorCode = getErrorCode();
            const diagnosticId = generateDiagnosticId();
            const generatedTime = formatTime(new Date());
            
            // 设备信息HTML
            const deviceInfoHTML = `
                <div class="info-item">
                    <div class="info-label"><i class="fas fa-code"></i> 浏览器内核</div>
                    <div class="info-value">${browserInfo.kernel}</div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="fas fa-window-restore"></i> 浏览器版本</div>
                    <div class="info-value">${browserInfo.version}</div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="fas fa-desktop"></i> 操作系统</div>
                    <div class="info-value">${osInfo}</div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="fas fa-language"></i> 默认语言</div>
                    <div class="info-value">${navigator.language || navigator.userLanguage || "未知"}</div>
                </div>
            `;
            
            // 网络信息HTML（延迟部分先显示加载中）
            const networkInfoHTML = `
                <div class="info-item">
                    <div class="info-label"><i class="fas fa-tachometer-alt"></i> 本次加载延迟</div>
                    <div class="info-value">
                        ${pageLoadTime ? `${pageLoadTime} ms` : '<span class="loading">计算中...</span>'}
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="fab fa-google"></i> Google访问延迟</div>
                    <div class="info-value">
                        <div class="latency-test">
                            <div class="latency-icon loading"><i class="fas fa-spinner fa-spin"></i></div>
                            <span class="loading">测试中...</span>
                        </div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="fab fa-baidu"></i> 百度访问延迟</div>
                    <div class="info-value">
                        <div class="latency-test">
                            <div class="latency-icon loading"><i class="fas fa-spinner fa-spin"></i></div>
                            <span class="loading">测试中...</span>
                        </div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="fas fa-exclamation-triangle"></i> 故障代码</div>
                    <div class="info-value">
                        <span class="error-code ${errorCode === 'NONE' ? 'no-error' : ''}">
                            ${errorCode}
                        </span>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="far fa-clock"></i> 生成时间</div>
                    <div class="info-value">${generatedTime}</div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="fas fa-id-card"></i> 诊断ID</div>
                    <div class="info-value diagnostic-id">${diagnosticId}</div>
                </div>
            `;
            
            document.getElementById('deviceInfo').innerHTML = deviceInfoHTML;
            document.getElementById('networkInfo').innerHTML = networkInfoHTML;
            
            // 开始测试网络延迟
            testNetworkLatency();
        }

        // 测试网络延迟
        function testNetworkLatency() {
            // 测试Google延迟
            testLatency("https://www.google.com/favicon.ico", function(googleLatency, googleError) {
                const googleElement = document.querySelector('.info-item:nth-child(2) .latency-test');
                if (googleLatency) {
                    const level = getLatencyLevel(googleLatency);
                    googleElement.innerHTML = `
                        <div class="latency-icon ${level.class}">${googleLatency < 1000 ? googleLatency : (googleLatency/1000).toFixed(1)+'s'}</div>
                        <span class="latency-value ${level.class.replace('latency-', '')}">${googleLatency} ms (${level.text})</span>
                    `;
                } else {
                    googleElement.innerHTML = `
                        <div class="latency-icon latency-poor"><i class="fas fa-times"></i></div>
                        <span class="latency-value error">${googleError}</span>
                    `;
                }
            });
            
            // 测试百度延迟
            testLatency("https://www.baidu.com/favicon.ico", function(baiduLatency, baiduError) {
                const baiduElement = document.querySelector('.info-item:nth-child(3) .latency-test');
                if (baiduLatency) {
                    const level = getLatencyLevel(baiduLatency);
                    baiduElement.innerHTML = `
                        <div class="latency-icon ${level.class}">${baiduLatency < 1000 ? baiduLatency : (baiduLatency/1000).toFixed(1)+'s'}</div>
                        <span class="latency-value ${level.class.replace('latency-', '')}">${baiduLatency} ms (${level.text})</span>
                    `;
                } else {
                    baiduElement.innerHTML = `
                        <div class="latency-icon latency-poor"><i class="fas fa-times"></i></div>
                        <span class="latency-value error">${baiduError}</span>
                    `;
                }
            });
        }

        // 复制诊断报告到剪贴板
        function copyDiagnosticReport() {
            const browserInfo = getBrowserInfo();
            const osInfo = getOSInfo();
            const pageLoadTime = getPageLoadTime();
            const errorCode = getErrorCode();
            
            // 获取延迟信息（从页面中提取）
            const googleLatencyElement = document.querySelector('.info-item:nth-child(2) .latency-value');
            const baiduLatencyElement = document.querySelector('.info-item:nth-child(3) .latency-value');
            const diagnosticIdElement = document.querySelector('.diagnostic-id');
            const generatedTimeElement = document.querySelector('.info-item:nth-child(5) .info-value');
            
            const report = `设备与网络诊断报告
==============================
诊断ID: ${diagnosticIdElement ? diagnosticIdElement.textContent : '未知'}
生成时间: ${generatedTimeElement ? generatedTimeElement.textContent : '未知'}

设备信息:
------------------------------
浏览器内核: ${browserInfo.kernel}
浏览器版本: ${browserInfo.version}
操作系统: ${osInfo}
默认语言: ${navigator.language || navigator.userLanguage || "未知"}

网络诊断:
------------------------------
页面加载延迟: ${pageLoadTime ? pageLoadTime + ' ms' : '未知'}
Google访问延迟: ${googleLatencyElement ? googleLatencyElement.textContent : '未知'}
百度访问延迟: ${baiduLatencyElement ? baiduLatencyElement.textContent : '未知'}
故障代码: ${errorCode}

注: 本报告由设备检测程序生成，仅供参考。
`;
            
            // 复制到剪贴板
            navigator.clipboard.writeText(report).then(() => {
                const originalText = document.getElementById('copyBtn').innerHTML;
                document.getElementById('copyBtn').innerHTML = '<i class="fas fa-check"></i> 已复制';
                document.getElementById('copyBtn').style.background = 'linear-gradient(to right, #20c997, #198754)';
                
                setTimeout(() => {
                    document.getElementById('copyBtn').innerHTML = originalText;
                    document.getElementById('copyBtn').style.background = 'linear-gradient(to right, #28a745, #20c997)';
                }, 2000);
            }).catch(err => {
                alert('复制失败，请手动复制报告内容');
                console.error('复制失败:', err);
            });
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            updateDeviceInfo();
            
            // 绑定刷新按钮事件
            document.getElementById('refreshBtn').addEventListener('click', function() {
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 检测中...';
                setTimeout(() => {
                    updateDeviceInfo();
                    this.innerHTML = '<i class="fas fa-redo-alt"></i> 重新检测';
                }, 500);
            });
            
            // 绑定复制按钮事件
            document.getElementById('copyBtn').addEventListener('click', copyDiagnosticReport);
        });
    </script>
</body>
</html>
